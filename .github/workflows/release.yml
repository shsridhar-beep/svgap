name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          expected="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"].replace("a", "-alpha."))')"
          test "$GITHUB_REF_NAME" = "$expected"
      - run: python -m pip install build
      - run: python -m build
      - name: Preserve Python distributions for trusted publishing
        uses: actions/upload-artifact@v7
        with:
          name: release-python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Build immutable research archives
        run: |
          git archive --format=tar.gz --prefix=reset-replication-v0.1/ -o dist/reset-replication-v0.1.tar.gz HEAD:artifacts/reset-replication-v0.1
          git archive --format=tar.gz --prefix=reset-taskpack-v0.2/ -o dist/reset-taskpack-v0.2.tar.gz HEAD:taskpacks/reset-replication-v0.2
          git archive --format=tar.gz --prefix=svgap-baselines-v0.1/ -o dist/svgap-baselines-v0.1.tar.gz HEAD:results
          git archive --format=tar.gz --prefix=temporal-equivalence-audit-v0.1/ -o dist/temporal-equivalence-audit-v0.1.tar.gz HEAD docs/temporal-equivalence-benchmark-audit.md reports/audits/temporal-equivalence-cvdp.csv reports/audits/temporal-equivalence-cvdp.json reports/audits/temporal-equivalence-rtllm.csv reports/audits/temporal-equivalence-rtllm.json reports/audits/temporal-equivalence-summary.json reports/audits/temporal-equivalence-validation-sample-v0.1.csv reports/audits/temporal-equivalence-verilog-eval.csv reports/audits/temporal-equivalence-verilog-eval.json scripts/audit_temporal_equivalence_benchmarks.py scripts/build_temporal_equivalence_audit_validation_sample.py src/svgap/contract_audit.py examples/functional_equivalence examples/synthesis_directive_equivalence examples/temporal_backpressure examples/temporal_pulse examples/temporal_response src/svgap/backends/equivalence_yosys.py src/svgap/backends/formal_yosys.py
          cp schemas/report-v1.json schemas/report-v2.json schemas/manifest-v2.example.toml schemas/functional-result-v1.json schemas/result-registry-v1.json schemas/submission-v1.json dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Create prerelease with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "SV-Gap $GITHUB_REF_NAME" \
            --notes-file "docs/release-notes-$GITHUB_REF_NAME.md"

  pypi:
    needs: [assets, container]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-python-distributions
          path: dist
      - name: Publish signed distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:0.3-alpha
            ghcr.io/${{ github.repository }}:latest-alpha
