schema_version = "2.0"
candidate_id = "temporal-backpressure-unsafe"

[design]
top = "elastic_buffer"
sources = ["design.sv"]

[functional]
commands = [
  ["iverilog", "-g2012", "-o", "${SVGAP_BUILD}/sim.vvp", "design.sv", "../tb.sv"],
  ["vvp", "${SVGAP_BUILD}/sim.vvp"],
]

[[oracles]]
id = "ready-valid-contract"
class = "protocol"
backend = "formal-yosys"
contributes_to_gap = true
required = true

[oracles.options]
property_sources = ["properties.sv"]
property_top = "temporal_backpressure_properties"
depth = 8
rule_id = "REF-PROT-001"
message = "valid and data are not held stable while backpressured"

[[oracles]]
id = "ordinary-lint"
class = "lint"
backend = "lint-verilator"
contributes_to_gap = false
required = false

[oracles.options]
extra_args = ["-Wno-DECLFILENAME"]

[intent]

[output]
report = "build/report.json"
